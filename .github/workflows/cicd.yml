name: CI/CD — Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────
  # Job 1 : Build validation
  # ──────────────────────────────────────────────
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_FRONTEND_URL: ${{ secrets.REACT_APP_FRONTEND_URL }}
          REACT_APP_PORT: ${{ secrets.REACT_APP_PORT }}

  # ──────────────────────────────────────────────
  # Job 2 : Build Docker image + Push to GHCR
  # ──────────────────────────────────────────────
  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-check
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app (avant docker build)
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_FRONTEND_URL: ${{ secrets.REACT_APP_FRONTEND_URL }}
          REACT_APP_PORT: ${{ secrets.REACT_APP_PORT }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ──────────────────────────────────────────────
  # Job 3 : Deploy sur VPS (zero-downtime)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to VPS (via Cloudflare Tunnel)
    runs-on: ubuntu-latest
    needs: build-image
    # Le port 22 du VPS n'est pas exposé publiquement : on passe par le tunnel
    # Cloudflare (Access SSH) via un service token, comme `ssh root@ssh.creachtheo.fr`.
    env:
      SSH_HOST: ${{ secrets.SSH_HOSTNAME }}
      SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.SSH_HOSTNAME }}
      # cloudflared lit ces variables pour s'authentifier sans navigateur
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets de déploiement (fail-fast, évite le login navigateur bloquant)
        run: |
          missing=0
          [ -n "${{ secrets.SSH_HOSTNAME }}" ]          || { echo "::error::Secret SSH_HOSTNAME manquant"; missing=1; }
          [ -n "${{ secrets.CF_ACCESS_CLIENT_ID }}" ]     || { echo "::error::Secret CF_ACCESS_CLIENT_ID manquant"; missing=1; }
          [ -n "${{ secrets.CF_ACCESS_CLIENT_SECRET }}" ] || { echo "::error::Secret CF_ACCESS_CLIENT_SECRET manquant"; missing=1; }
          [ "$missing" -eq 0 ] || { echo "Ajoute les secrets manquants puis relance (Re-run jobs)."; exit 1; }

      - name: Set image tag
        id: set-tag
        run: echo "IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Install cloudflared (pin 2026.5.1)
        # ⚠️ 2026.6.0 a une régression : `access ssh` ignore le service token (flags,
        # env ET -H) et force l'auth navigateur → SSH timeout en CI.
        # cf. https://github.com/cloudflare/cloudflared/issues/1673 — on épingle la
        # dernière version fonctionnelle tant qu'aucun correctif n'est publié.
        env:
          CLOUDFLARED_VERSION: "2026.5.1"
        run: |
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb" -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Configure SSH over Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/config <<EOF
          Host $SSH_HOST
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${{ secrets.CF_ACCESS_CLIENT_ID }} --service-token-secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EOF
          chmod 600 ~/.ssh/config

      - name: Copy docker-compose.prod.yml to VPS
        run: scp docker-compose.prod.yml "$SSH_TARGET:${{ secrets.VPS_DEPLOY_PATH }}/"

      - name: Deploy (server pulls image from GHCR)
        env:
          IMAGE_TAG: ${{ steps.set-tag.outputs.IMAGE_TAG }}
        run: |
          ssh "$SSH_TARGET" IMAGE_TAG="$IMAGE_TAG" GITHUB_REPOSITORY="${{ github.repository }}" \
            GHCR_ACTOR="${{ github.actor }}" GHCR_PAT="${{ secrets.GHCR_PAT }}" \
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH }}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          echo "Deploying image: ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}"
          export IMAGE_TAG GITHUB_REPOSITORY
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
          echo "Waiting for health checks..."
          sleep 20
          docker compose -f docker-compose.prod.yml ps
          docker image prune -f
          REMOTE
